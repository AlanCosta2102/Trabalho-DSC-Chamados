spring.application.name=sistema-chamados-ifrn

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chamados_ifrn}
spring.datasource.username=${DB_USERNAME:chamados}
spring.datasource.password=${DB_PASSWORD:chamados_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080